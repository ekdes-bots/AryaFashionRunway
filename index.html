<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fashion Studio & Runway Show</title>
    <!-- Tailwind CSS for modern layout -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Playfair+Display:ital,wght@0,700;1,600&display=swap');

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            overflow-x: hidden;
        }

        .serif {
            font-family: 'Playfair Display', serif;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(236, 72, 153, 0.4);
            border-radius: 9999px;
        }

        /* Runway Spotlights */
        .spotlight-left {
            background: radial-gradient(circle at 0% 0%, rgba(255, 255, 255, 0.8) 0%, rgba(244, 114, 182, 0.3) 30%, transparent 70%);
            animation: pulseLight 4s infinite alternate ease-in-out;
        }
        .spotlight-right {
            background: radial-gradient(circle at 100% 0%, rgba(255, 255, 255, 0.8) 0%, rgba(192, 132, 252, 0.3) 30%, transparent 70%);
            animation: pulseLight 4s infinite alternate-reverse ease-in-out;
        }

        @keyframes pulseLight {
            0% { opacity: 0.5; transform: scale(1); }
            100% { opacity: 0.9; transform: scale(1.1); }
        }

        /* Avatar Walking Animation on Runway */
        @keyframes runwayWalk {
            0% { transform: translateY(120px) scale(0.65); }
            50% { transform: translateY(-10px) scale(1.05); }
            100% { transform: translateY(120px) scale(0.65); }
        }

        .animate-walk {
            animation: runwayWalk 8s ease-in-out infinite;
        }

        /* Camera Flash Overlay */
        .camera-flash {
            animation: flashAnim 0.25s ease-out forwards;
        }

        @keyframes flashAnim {
            0% { opacity: 0.95; background-color: white; }
            100% { opacity: 0; background-color: transparent; }
        }

        /* Pop Animation for Hype Text */
        @keyframes popIn {
            0% { transform: scale(0.3) rotate(-10deg); opacity: 0; }
            50% { transform: scale(1.2) rotate(5deg); opacity: 1; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        .animate-pop {
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        /* Gentle Bobbing Animation for Studio Avatar */
        @keyframes subtleIdle {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }

        .avatar-idle {
            animation: subtleIdle 3.5s ease-in-out infinite;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-pink-500 selection:text-white">

    <!-- Top Header -->
    <header class="w-full bg-slate-900/80 backdrop-blur-md border-b border-slate-800 p-4 sticky top-0 z-30 flex justify-between items-center shadow-lg">

                <i class="fa-solid font-sparkles text-white text-base"></i>
                <span class="text-white text-lg font-black">✦</span>
            </div>
            <div>

                <p class="text-[10px] tracking-widest text-slate-400 uppercase font-semibold">Fashion Studio</p>
            </div>
        </div>

        <div class="flex items-center space-x-2">
            <button id="resetBtn" onclick="clearLook()" class="px-3 py-1.5 rounded-full text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 active:scale-95 transition-all flex items-center gap-1.5">
                <i class="fa-solid fa-rotate-left"></i>
                <span>Reset</span>
            </button>
            <button onclick="launchRunway()" class="px-4 py-1.5 rounded-full text-xs font-bold bg-gradient-to-r from-pink-500 to-purple-600 hover:from-pink-600 hover:to-purple-700 text-white shadow-lg shadow-pink-500/25 active:scale-95 transition-all flex items-center gap-2">
                <i class="fa-solid fa-person-walking-arrow-right"></i>
                <span>RUNWAY</span>
            </button>
        </div>
    </header>

    <!-- Main Studio Screen -->

        <!-- Left / Center: Avatar Display Stage -->
        <section class="md:col-span-6 lg:col-span-5 flex flex-col items-center justify-center bg-gradient-to-b from-slate-900 via-slate-900/90 to-slate-950 rounded-3xl p-4 border border-slate-800/80 shadow-2xl relative overflow-hidden min-h-[380px]">
            <!-- Subtle Background Glow -->

            <div class="absolute w-48 h-48 bg-purple-500/10 rounded-full blur-2xl pointer-events-none bottom-4"></div>

            <p class="text-xs font-medium text-pink-400/80 uppercase tracking-wider mb-2 flex items-center gap-1">
                <span>Model Fitting Stage</span>
            </p>

            <!-- SVG Avatar Visualizer -->
            <div class="relative w-full max-w-[280px] aspect-[3/4] flex items-center justify-center avatar-idle">
                <svg id="avatarSvg" viewBox="0 0 300 450" class="w-full h-full drop-shadow-2xl">
                    <!-- Base Shadow -->
                    <ellipse cx="150" cy="420" rx="60" ry="10" fill="#000000" opacity="0.4" />

                    <!-- Base Body Model -->
                    <g id="bodyGroup">
                        <!-- Legs / Skin -->
                        <rect x="125" y="250" width="20" height="150" rx="10" fill="#f5d0c5" />
                        <rect x="155" y="250" width="20" height="150" rx="10" fill="#f5d0c5" />
                        
                        <!-- Base Feet -->
                        <ellipse cx="132" cy="400" rx="12" ry="6" fill="#e0b0a3" />
                        <ellipse cx="168" cy="400" rx="12" ry="6" fill="#e0b0a3" />

                        <!-- Torso / Skin -->
                        <path d="M 120 120 Q 150 110 180 120 L 175 260 Q 150 265 125 260 Z" fill="#f5d0c5" />

                        <!-- Neck & Head -->
                        <rect x="141" y="90" width="18" height="35" rx="8" fill="#f5d0c5" />
                        <ellipse cx="150" cy="80" rx="30" ry="36" fill="#f5d0c5" />

                        <!-- Facial Features -->
                        <ellipse cx="138" cy="78" rx="3" ry="4" fill="#334155" />
                        <ellipse cx="162" cy="78" rx="3" ry="4" fill="#334155" />
                        <!-- Lips -->
                        <path d="M 143 96 Q 150 102 157 96 Q 150 99 143 96 Z" fill="#e11d48" />

                        <!-- Hair -->
                        <path d="M 115 80 C 115 30, 185 30, 185 80 C 185 95, 180 120, 180 140 C 175 110, 175 60, 150 60 C 125 60, 125 110, 120 140 C 120 120, 115 95, 115 80 Z" fill="#292524" />

                        <!-- Arms -->
                        <path d="M 120 125 Q 105 180 108 220" stroke="#f5d0c5" stroke-width="14" stroke-linecap="round" fill="none" />
                        <path d="M 180 125 Q 195 180 192 220" stroke="#f5d0c5" stroke-width="14" stroke-linecap="round" fill="none" />
                    </g>

                    <!-- DYNAMIC OUTFIT LAYERS -->
                    <g id="layerShoes"></g>
                    <g id="layerBottoms"></g>
                    <g id="layerTops"></g>
                    <g id="layerDresses"></g>
                    <g id="layerAccessories"></g>
                </svg>
            </div>

            <!-- Current Look Tags Bar -->
            <div id="equippedTags" class="w-full flex flex-wrap justify-center gap-1.5 mt-3 min-h-[32px]">
                <span class="text-[11px] text-slate-500 italic">No items selected</span>
            </div>
        </section>

        <!-- Right: Studio Closet Selector -->
        <section class="md:col-span-6 lg:col-span-7 bg-slate-900/60 border border-slate-800 rounded-3xl p-4 flex flex-col h-[500px] md:h-auto">
            
            <!-- Category Tabs Navigation -->
            <nav class="flex space-x-1 border-b border-slate-800 pb-3 overflow-x-auto no-scrollbar">
                <button onclick="switchCategory('tops')" id="tab-tops" class="category-tab px-4 py-2 rounded-xl text-xs font-bold transition-all bg-pink-500 text-white shadow-md shadow-pink-500/20 whitespace-nowrap flex items-center gap-2">
                    <i class="fa-solid fa-shirt"></i> Tops
                </button>
                <button onclick="switchCategory('bottoms')" id="tab-bottoms" class="category-tab px-4 py-2 rounded-xl text-xs font-bold transition-all text-slate-400 hover:text-slate-200 hover:bg-slate-800/80 whitespace-nowrap flex items-center gap-2">
                    <i class="fa-solid fa-user-ninja"></i> Bottoms
                </button>
                <button onclick="switchCategory('dresses')" id="tab-dresses" class="category-tab px-4 py-2 rounded-xl text-xs font-bold transition-all text-slate-400 hover:text-slate-200 hover:bg-slate-800/80 whitespace-nowrap flex items-center gap-2">
                    <i class="fa-solid fa-person-dress"></i> Dresses
                </button>
                <button onclick="switchCategory('shoes')" id="tab-shoes" class="category-tab px-4 py-2 rounded-xl text-xs font-bold transition-all text-slate-400 hover:text-slate-200 hover:bg-slate-800/80 whitespace-nowrap flex items-center gap-2">
                    <i class="fa-solid fa-shoe-prints"></i> Shoes
                </button>
                <button onclick="switchCategory('accessories')" id="tab-accessories" class="category-tab px-4 py-2 rounded-xl text-xs font-bold transition-all text-slate-400 hover:text-slate-200 hover:bg-slate-800/80 whitespace-nowrap flex items-center gap-2">
                    <i class="fa-solid fa-glasses"></i> Accessories
                </button>
            </nav>

            <!-- Closet Grid Container -->
            <div id="closetGrid" class="grid grid-cols-2 sm:grid-cols-3 gap-3 p-2 mt-2 overflow-y-auto flex-1 pr-1">
                <!-- Items will be generated dynamically by JS -->
            </div>
        </section>

    </main>

    <!-- RUNWAY SHOW FULLSCREEN MODAL -->
    <div id="runwayView" class="fixed inset-0 z-50 bg-slate-950 hidden flex-col justify-between overflow-hidden">
        
        <!-- Animated Spotlights -->
        <div class="absolute inset-0 pointer-events-none z-10">
            <div class="absolute top-0 left-0 w-1/2 h-full spotlight-left"></div>
            <div class="absolute top-0 right-0 w-1/2 h-full spotlight-right"></div>
            <!-- Camera Flash Canvas Overlay -->
            <div id="flashOverlay" class="absolute inset-0 pointer-events-none"></div>
        </div>

        <!-- Runway Top HUD Control -->
        <header class="relative z-30 p-4 flex justify-between items-center bg-gradient-to-b from-slate-950/90 to-transparent">
            <div class="flex items-center space-x-3">
                <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-bold bg-pink-500/20 text-pink-400 border border-pink-500/30">
                    <span class="w-2 h-2 rounded-full bg-pink-500 animate-ping mr-2"></span>
                    LIVE SHOW
                </span>
                <p id="trackTitle" class="text-xs text-slate-400 hidden sm:block">Track: Synth-Catwalk Beat</p>
            </div>

            <div class="flex items-center gap-3">
                <button id="audioToggle" onclick="toggleAudio()" class="w-10 h-10 rounded-full bg-slate-900/80 border border-slate-700 flex items-center justify-center text-slate-200 active:scale-90 transition-all shadow-lg">
                    <i id="audioIcon" class="fa-solid fa-volume-high"></i>
                </button>
                <button onclick="closeRunway()" class="px-4 py-2 rounded-full bg-pink-600 hover:bg-pink-500 text-white font-bold text-xs shadow-lg shadow-pink-600/30 active:scale-95 transition-all flex items-center gap-2">
                    <i class="fa-solid fa-xmark text-sm"></i>
                    <span>EXIT</span>
                </button>
            </div>
        </header>

        <!-- Audience Hype Floating Badges -->
        <div id="hypeContainer" class="absolute inset-x-0 top-24 z-30 flex justify-center items-center pointer-events-none">
            <!-- Dynamic reaction popups like "STUNNING!" -->
        </div>

        <!-- Runway Stage / Perspective Track -->
        <div class="relative flex-1 flex items-center justify-center z-20">
            
            <!-- Perspective Runway Floor -->
            <div class="absolute bottom-0 w-full h-[65%] bg-gradient-to-t from-slate-900 via-purple-950/40 to-transparent flex justify-center">
                <div class="w-2/3 h-full bg-gradient-to-t from-slate-800 via-pink-950/30 to-slate-900 border-x-2 border-pink-500/30 shadow-2xl transform perspective-1000 rotateX-45"></div>
            </div>

            <!-- Avatar Walking on Runway Container -->
            <div id="runwayAvatarContainer" class="relative z-20 w-64 h-96 flex items-center justify-center animate-walk">
                <!-- SVG cloned here dynamically -->
            </div>
        </div>

        <!-- Footer / Photographer Flash triggers -->
        <footer class="relative z-30 p-6 flex flex-col items-center justify-center bg-gradient-to-t from-slate-950 via-slate-950/80 to-transparent">
            <p class="text-xs text-slate-400 font-medium tracking-wider mb-2">TAP RUNWAY TO CHEER</p>
            <div class="flex gap-2">
                <button onclick="triggerCheer('FIERCE! ✨')" class="px-3 py-1.5 bg-slate-800/90 hover:bg-pink-600 text-white text-xs font-semibold rounded-full border border-slate-700 transition-all active:scale-95">✨ FIERCE!</button>
                <button onclick="triggerCheer('10/10! 🔥')" class="px-3 py-1.5 bg-slate-800/90 hover:bg-pink-600 text-white text-xs font-semibold rounded-full border border-slate-700 transition-all active:scale-95">🔥 10/10!</button>
                <button onclick="triggerCheer('STUNNING! 💖')" class="px-3 py-1.5 bg-slate-800/90 hover:bg-pink-600 text-white text-xs font-semibold rounded-full border border-slate-700 transition-all active:scale-95">💖 STUNNING!</button>
            </div>
        </footer>
    </div>

    <script>
        // --- 1. CLOSET DATABASE (SVG Graphic definitions) ---
        const CLOSET_ITEMS = {
            tops: [
                {
                    id: 'top-1',
                    name: 'Pink Crop Top',
                    icon: '👕',
                    color: '#ec4899',
                    svg: `<path d="M 125 120 L 175 120 L 170 170 L 130 170 Z" fill="#ec4899" />
                          <path d="M 115 125 L 130 120 L 125 145 Z" fill="#db2777" />
                          <path d="M 185 125 L 170 120 L 175 145 Z" fill="#db2777" />`
                },
                {
                    id: 'top-2',
                    name: 'Gold Blazer',
                    icon: '🧥',
                    color: '#eab308',
                    svg: `<path d="M 120 120 L 180 120 L 175 195 L 125 195 Z" fill="#eab308" />
                          <path d="M 140 120 L 150 160 L 160 120 Z" fill="#1e293b" />
                          <path d="M 120 120 L 140 160 L 125 195 Z" fill="#ca8a04" />
                          <path d="M 180 120 L 160 160 L 175 195 Z" fill="#ca8a04" />`
                },
                {
                    id: 'top-3',
                    name: 'Cyber Neon Hoodie',
                    icon: '🥼',
                    color: '#06b6d4',
                    svg: `<path d="M 118 118 L 182 118 L 178 190 L 122 190 Z" fill="#06b6d4" />
                          <path d="M 135 150 L 165 150 L 160 175 L 140 175 Z" fill="#0891b2" />
                          <path d="M 110 125 L 125 120 L 115 175 Z" fill="#0891b2" />
                          <path d="M 190 125 L 175 120 L 185 175 Z" fill="#0891b2" />`
                }
            ],
            bottoms: [
                {
                    id: 'bot-1',
                    name: 'Denim Jeans',
                    icon: '👖',
                    color: '#3b82f6',
                    svg: `<path d="M 125 190 L 175 190 L 175 350 L 152 350 L 150 220 L 148 220 L 148 350 L 125 350 Z" fill="#2563eb" />
                          <path d="M 125 190 L 175 190 L 175 210 L 125 210 Z" fill="#1d4ed8" />`
                },
                {
                    id: 'bot-2',
                    name: 'Leather Mini Skirt',
                    icon: '👗',
                    color: '#0f172a',
                    svg: `<path d="M 125 185 L 175 185 L 185 240 L 115 240 Z" fill="#0f172a" />
                          <line x1="150" y1="185" x2="150" y2="240" stroke="#334155" stroke-width="2" />`
                },
                {
                    id: 'bot-3',
                    name: 'Emerald Flare Pants',
                    icon: '👖',
                    color: '#10b981',
                    svg: `<path d="M 126 190 L 174 190 L 178 355 L 153 355 L 150 230 L 147 230 L 122 355 L 122 355 Z" fill="#059669" />`
                }
            ],
            dresses: [
                {
                    id: 'drs-1',
                    name: 'Gala Red Gown',
                    icon: '💃',
                    color: '#ef4444',
                    svg: `<path d="M 130 120 L 170 120 L 180 180 L 205 370 L 95 370 L 120 180 Z" fill="#dc2626" />
                          <path d="M 130 120 Q 150 140 170 120 L 165 160 Q 150 170 135 160 Z" fill="#b91c1c" />`
                },
                {
                    id: 'drs-2',
                    name: 'Sparkle Party Dress',
                    icon: '✨',
                    color: '#a855f7',
                    svg: `<path d="M 125 125 L 175 125 L 185 250 L 115 250 Z" fill="#a855f7" />
                          <circle cx="140" cy="160" r="3" fill="#ffffff" opacity="0.8" />
                          <circle cx="160" cy="190" r="4" fill="#ffffff" opacity="0.8" />
                          <circle cx="130" cy="220" r="3" fill="#ffffff" opacity="0.8" />
                          <circle cx="170" cy="230" r="2" fill="#ffffff" opacity="0.8" />`
                }
            ],
            shoes: [
                {
                    id: 'sho-1',
                    name: 'Red High Heels',
                    icon: '👠',
                    color: '#f43f5e',
                    svg: `<path d="M 120 390 L 140 390 L 138 410 L 128 410 Z" fill="#e11d48" />
                          <path d="M 160 390 L 180 390 L 178 410 L 168 410 Z" fill="#e11d48" />
                          <line x1="124" y1="400" x2="124" y2="415" stroke="#9f1239" stroke-width="3" />
                          <line x1="176" y1="400" x2="176" y2="415" stroke="#9f1239" stroke-width="3" />`
                },
                {
                    id: 'sho-2',
                    name: 'Chunky Chunky Sneakers',
                    icon: '👟',
                    color: '#ffffff',
                    svg: `<rect x="118" y="390" width="26" height="22" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" />
                          <rect x="156" y="390" width="26" height="22" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" />
                          <rect x="116" y="406" width="30" height="8" rx="2" fill="#334155" />
                          <rect x="154" y="406" width="30" height="8" rx="2" fill="#334155" />`
                }
            ],
            accessories: [
                {
                    id: 'acc-1',
                    name: 'VIP Sunglasses',
                    icon: '🕶️',
                    color: '#1e293b',
                    svg: `<rect x="126" y="70" width="20" height="12" rx="2" fill="#0f172a" stroke="#e2e8f0" stroke-width="1.5" />
                          <rect x="154" y="70" width="20" height="12" rx="2" fill="#0f172a" stroke="#e2e8f0" stroke-width="1.5" />
                          <line x1="146" y1="74" x2="154" y2="74" stroke="#e2e8f0" stroke-width="2" />`
                },
                {
                    id: 'acc-2',
                    name: 'Royal Crown',
                    icon: '👑',
                    color: '#eab308',
                    svg: `<path d="M 125 48 L 135 60 L 150 42 L 165 60 L 175 48 L 170 65 L 130 65 Z" fill="#facc15" stroke="#ca8a04" stroke-width="1" />
                          <circle cx="150" cy="52" r="2.5" fill="#ef4444" />`
                },
                {
                    id: 'acc-3',
                    name: 'Gold Necklace',
                    icon: '📿',
                    color: '#eab308',
                    svg: `<path d="M 132 120 Q 150 145 168 120" stroke="#facc15" stroke-width="3" fill="none" stroke-dasharray="4,2" />
                          <circle cx="150" cy="133" r="4" fill="#ec4899" />`
                }
            ]
        };

        // --- 2. APP STATE ---
        let activeCategory = 'tops';
        let equippedLook = {
            tops: null,
            bottoms: null,
            dresses: null,
            shoes: null,
            accessories: null
        };

        // --- 3. UI RENDERING & INTERACTION ---
        function switchCategory(category) {
            activeCategory = category;
            
            // Update Tab active styling
            document.querySelectorAll('.category-tab').forEach(tab => {
                tab.className = 'category-tab px-4 py-2 rounded-xl text-xs font-bold transition-all text-slate-400 hover:text-slate-200 hover:bg-slate-800/80 whitespace-nowrap flex items-center gap-2';
            });
            const activeTab = document.getElementById(`tab-${category}`);
            if (activeTab) {
                activeTab.className = 'category-tab px-4 py-2 rounded-xl text-xs font-bold transition-all bg-pink-500 text-white shadow-md shadow-pink-500/20 whitespace-nowrap flex items-center gap-2';
            }

            renderClosetGrid();
        }

        function renderClosetGrid() {
            const grid = document.getElementById('closetGrid');
            grid.innerHTML = '';

            const items = CLOSET_ITEMS[activeCategory] || [];
            items.forEach(item => {
                const isEquipped = equippedLook[activeCategory]?.id === item.id;

                const card = document.createElement('button');
                card.onclick = () => toggleItem(activeCategory, item);
                card.className = `p-3 rounded-2xl border flex flex-col items-center justify-between gap-2 transition-all duration-200 text-center relative group active:scale-95 ${
                    isEquipped 
                    ? 'bg-pink-500/10 border-pink-500 ring-2 ring-pink-500/40 shadow-lg shadow-pink-500/10' 
                    : 'bg-slate-800/50 border-slate-700/60 hover:border-slate-600 hover:bg-slate-800'
                }`;

                card.innerHTML = `
                    ${isEquipped ? '<span class="absolute top-2 right-2 w-2 h-2 rounded-full bg-pink-500"></span>' : ''}
                    <div class="text-3xl my-1 group-hover:scale-110 transition-transform">${item.icon}</div>
                    <div>
                        <div class="text-xs font-bold text-slate-200">${item.name}</div>
                        <div class="text-[10px] text-slate-400 uppercase tracking-wider mt-0.5">${activeCategory.slice(0, -1)}</div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function toggleItem(category, item) {
            // Handle dress vs top/bottom conflict logic
            if (category === 'dresses') {
                if (equippedLook.dresses?.id === item.id) {
                    equippedLook.dresses = null;
                } else {
                    equippedLook.dresses = item;
                    // Auto un-equip tops and bottoms when equipping full dress
                    equippedLook.tops = null;
                    equippedLook.bottoms = null;
                }
            } else if (category === 'tops' || category === 'bottoms') {
                // Un-equip dress if top or bottom selected
                equippedLook.dresses = null;
                equippedLook[category] = (equippedLook[category]?.id === item.id) ? null : item;
            } else {
                equippedLook[category] = (equippedLook[category]?.id === item.id) ? null : item;
            }

            updateAvatarVisuals();
            renderClosetGrid();
        }

        function clearLook() {
            equippedLook = { tops: null, bottoms: null, dresses: null, shoes: null, accessories: null };
            updateAvatarVisuals();
            renderClosetGrid();
        }

        function updateAvatarVisuals() {
            // Clear SVG layers
            ['layerTops', 'layerBottoms', 'layerDresses', 'layerShoes', 'layerAccessories'].forEach(layerId => {
                document.getElementById(layerId).innerHTML = '';
            });

            // Update DOM SVG with equipped items
            if (equippedLook.shoes) document.getElementById('layerShoes').innerHTML = equippedLook.shoes.svg;
            if (equippedLook.bottoms) document.getElementById('layerBottoms').innerHTML = equippedLook.bottoms.svg;
            if (equippedLook.tops) document.getElementById('layerTops').innerHTML = equippedLook.tops.svg;
            if (equippedLook.dresses) document.getElementById('layerDresses').innerHTML = equippedLook.dresses.svg;
            if (equippedLook.accessories) document.getElementById('layerAccessories').innerHTML = equippedLook.accessories.svg;

            // Render Tags HUD
            const tagsContainer = document.getElementById('equippedTags');
            tagsContainer.innerHTML = '';
            
            const activeItems = Object.values(equippedLook).filter(Boolean);
            
            if (activeItems.length === 0) {
                tagsContainer.innerHTML = '<span class="text-[11px] text-slate-500 italic">No items selected</span>';
            } else {
                activeItems.forEach(item => {
                    const tag = document.createElement('span');
                    tag.className = 'px-2.5 py-0.5 rounded-full text-[10px] font-semibold bg-pink-500/20 text-pink-300 border border-pink-500/30 flex items-center gap-1';
                    tag.innerHTML = `<span>${item.icon}</span> <span>${item.name}</span>`;
                    tagsContainer.appendChild(tag);
                });
            }
        }

        // --- 4. WEB AUDIO SYNTHESIZER (Catwalk Synth Beat) ---
        let audioCtx = null;
        let isPlayingAudio = false;
        let audioTimer = null;

        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }
        }

        function playSynthKick(time) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.frequency.setValueAtTime(120, time);
            osc.frequency.exponentialRampToValueAtTime(0.01, time + 0.3);
            gain.gain.setValueAtTime(1, time);
            gain.gain.exponentialRampToValueAtTime(0.01, time + 0.3);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(time);
            osc.stop(time + 0.3);
        }

        function playHiHat(time) {
            const bufferSize = audioCtx.sampleRate * 0.05;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = Math.random() * 2 - 1;
            }
            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'highpass';
            filter.frequency.value = 7000;
            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(0.3, time);
            gain.gain.exponentialRampToValueAtTime(0.01, time + 0.05);
            noise.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);
            noise.start(time);
        }

        function startCatwalkMusic() {
            initAudio();
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            isPlayingAudio = true;
            document.getElementById('audioIcon').className = 'fa-solid fa-volume-high text-pink-400';

            let step = 0;
            const tempo = 124; // Fashion BPM
            const stepTime = (60 / tempo) / 4;

            function scheduleLoop() {
                if (!isPlayingAudio) return;
                const now = audioCtx.currentTime;
                for (let i = 0; i < 16; i++) {
                    const time = now + (i * stepTime);
                    // Kick drum on 1, 5, 9, 13
                    if (i % 4 === 0) playSynthKick(time);
                    // Hi-hats on off-beats
                    if (i % 2 === 1) playHiHat(time);
                }
                audioTimer = setTimeout(scheduleLoop, stepTime * 16 * 1000);
            }
            scheduleLoop();
        }

        function stopCatwalkMusic() {
            isPlayingAudio = false;
            if (audioTimer) clearTimeout(audioTimer);
            document.getElementById('audioIcon').className = 'fa-solid fa-volume-xmark text-slate-400';
        }

        function toggleAudio() {
            if (isPlayingAudio) {
                stopCatwalkMusic();
            } else {
                startCatwalkMusic();
            }
        }

        // --- 5. RUNWAY SHOW LOGIC ---
        let flashInterval = null;

        function launchRunway() {
            const runwayView = document.getElementById('runwayView');
            const runwayAvatarContainer = document.getElementById('runwayAvatarContainer');
            
            // Clone Avatar SVG to Runway View
            const avatarSvg = document.getElementById('avatarSvg').cloneNode(true);
            runwayAvatarContainer.innerHTML = '';
            runwayAvatarContainer.appendChild(avatarSvg);

            runwayView.classList.remove('hidden');
            runwayView.classList.add('flex');

            // Start Audio & Camera Flashes
            startCatwalkMusic();
            startCameraFlashes();
            triggerCheer('WORK IT! ✨');
        }

        function closeRunway() {
            const runwayView = document.getElementById('runwayView');
            runwayView.classList.add('hidden');
            runwayView.classList.remove('flex');

            stopCatwalkMusic();
            if (flashInterval) clearInterval(flashInterval);
        }

        function startCameraFlashes() {
            if (flashInterval) clearInterval(flashInterval);
            const overlay = document.getElementById('flashOverlay');

            flashInterval = setInterval(() => {
                if (Math.random() > 0.4) {
                    const flash = document.createElement('div');
                    flash.className = 'absolute inset-0 camera-flash pointer-events-none';
                    overlay.appendChild(flash);
                    setTimeout(() => flash.remove(), 300);
                }
            }, 600);
        }

        function triggerCheer(text) {
            const container = document.getElementById('hypeContainer');
            const badge = document.createElement('div');
            badge.className = 'px-5 py-2 rounded-full bg-gradient-to-r from-pink-500 to-purple-600 text-white font-extrabold text-lg sm:text-2xl shadow-2xl animate-pop border border-white/20 tracking-wider';
            badge.innerText = text;

            container.innerHTML = '';
            container.appendChild(badge);
            setTimeout(() => {
                badge.remove();
            }, 1800);
        }

        // --- 6. INITIALIZATION ---
        window.onload = () => {
            switchCategory('tops');
            updateAvatarVisuals();
        };
    </script>
</body>
